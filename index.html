<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Final</title>
    <link rel="stylesheet" href="/css/reset.css">

    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/settings-component.css">
</head>

<body>

    <main id="game-container">
        <h1 class="top-row">Color Battle</h1>
        <div class="middle-row">
            <div class="side-col">
                <h2 id="userName1"></h2>
                <p id="user1Score"></p>
                <input type="color" name="user1ColorPicker" id="user1ColorPicker" placeholder="blue">
                <div class="icon-holder">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 0 512 512">
                        <path
                            d="M80 160c0-35.3 28.7-64 64-64l32 0c35.3 0 64 28.7 64 64l0 3.6c0 21.8-11.1 42.1-29.4 53.8l-42.2 27.1c-25.2 16.2-40.4 44.1-40.4 74l0 1.4c0 17.7 14.3 32 32 32s32-14.3 32-32l0-1.4c0-8.2 4.2-15.8 11-20.2l42.2-27.1c36.6-23.6 58.8-64.1 58.8-107.7l0-3.6c0-70.7-57.3-128-128-128l-32 0C73.3 32 16 89.3 16 160c0 17.7 14.3 32 32 32s32-14.3 32-32zm80 320a40 40 0 1 0 0-80 40 40 0 1 0 0 80z" />
                    </svg>
                </div>
            </div>
            <div class="middle-col">
                <div class="game-board" id="gameBoard"></div>

                <div class="board-annex">
                    <p id="currentTurn">Jugador 1</p>
                    <div class="button-container">
                        <button type="button" id="startGameBtn">Iniciar</button>
                        <button type="button" id="resetGameBtn">Reiniciar</button>
                    </div>
                </div>

            </div>
            <div class="side-col">
                <h2 id="userName2"></h2>
                <p id="user2Score"></p>
                <input type="color" name="user2ColorPicker" id="user2ColorPicker">
                <div class="icon-holder">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                        <path
                            d="M352 320c88.4 0 160-71.6 160-160c0-15.3-2.2-30.1-6.2-44.2c-3.1-10.8-16.4-13.2-24.3-5.3l-76.8 76.8c-3 3-7.1 4.7-11.3 4.7L336 192c-8.8 0-16-7.2-16-16l0-57.4c0-4.2 1.7-8.3 4.7-11.3l76.8-76.8c7.9-7.9 5.4-21.2-5.3-24.3C382.1 2.2 367.3 0 352 0C263.6 0 192 71.6 192 160c0 19.1 3.4 37.5 9.5 54.5L19.9 396.1C7.2 408.8 0 426.1 0 444.1C0 481.6 30.4 512 67.9 512c18 0 35.3-7.2 48-19.9L297.5 310.5c17 6.2 35.4 9.5 54.5 9.5zM80 408a24 24 0 1 1 0 48 24 24 0 1 1 0-48z" />
                    </svg>
                </div>
            </div>

        </div>



    </main>

    <form id="settings-container">
        <div class="settings-input">
            <label>Usuario 1:</label>
            <input type="text" id="userName1Input" value="Jugador 1">
        </div>
        <div class="settings-input">
            <label>Usuario 2:</label>
            <input type="text" id="userName2Input" value="Jugador 2">
        </div>
        <div class="settings-input">
            <label>
                FX Sound:
                <input type="checkbox" name="Efectos" id="soundEffectsInput">
            </label>

        </div>
        <div class="settings-input">
            <label>Música:
                <input type="checkbox" name="Música" id="musicEffectsInput">
            </label>

        </div>
        <div class="settings-input" id="difficult-selector-container">
            <div class="game-mode-container">
                <p>Modo de Juego:</p>
            </div>
            <label>
                <img src="facil.png" alt="Fácil">
                <input type="radio" name="difficulty" value="easy">
                Normal
            </label>
            <label>
                <img src="dificil.png" alt="Difícil">
                <input type="radio" name="difficulty" value="hard">
                Diagonal
            </label>
        </div>
        <div class="settings-input">
            <label for="">
                <input type="checkbox" name="save" id="saveModeStatus">
                Guardar Partida
            </label>
        </div>
        <div class="settings-input">
            <label for="">
                Tiempo Turno:
                <input type="number" id="turnDuration" value="30"><span class="timeStamp"
                    id="turnDurationTimeStamp"></span>segundos</span>
            </label>

        </div>
        <div class="settings-input">
            <label for="">
                Tamaño Tablero:
                <input type="number" id="boardSizeInput" value="10"><span class="timeStamp"></span>
                casillas</span>
            </label>
        </div>


    </form>

    <script src="/js/script.js"></script>
</body>

</html>
